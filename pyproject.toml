[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-suite"
version = "1.0.0"
description = "Unified local music analysis, mastering, visualization, and ComfyUI generation suite."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vladimir Chopine" }]
maintainers = [{ name = "Geekatplay Studio" }]
dependencies = [
  "fastapi>=0.136.0",
  "uvicorn>=0.44.0",
  "dash>=3.2.0",
  "dash-bootstrap-components>=2.0.4",
  "plotly>=6.7.0",
  "kaleido>=0.2.1",
  "numpy>=2.4.2",
  "scipy>=1.17.1",
  "librosa>=0.11.0",
  "pyloudnorm>=0.2.0",
  "soundfile>=0.13.1",
  "mutagen>=1.47.0",
  "ffmpeg-python>=0.2.0",
  "sqlalchemy>=2.0.49",
  "alembic>=1.18.4",
  "jinja2>=3.1.6",
  "weasyprint>=68.1",
  "requests>=2.33.1",
  "python-multipart>=0.0.26",
  "pydantic>=2.13.3",
  "langgraph>=0.1.0",
  "mcp>=1.28.1,<2",
]

[project.scripts]
music-suite-mcp = "apps.mcp.server:main"

[project.optional-dependencies]
gpu = [
  "torch>=2.6.0",
  "torchaudio>=2.6.0",
  "nnAudio>=0.3.3",
]
pro = [
  "pyebur128",
  "pedalboard",
  "matchering",
]
dev = [
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "httpx2>=2.7.0",
  "ruff>=0.15.11",
  "mypy>=1.20.1",
]

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["audioqi*", "apps*"]

[tool.setuptools.package-data]
"audioqi.integrations.comfyui.sonic_holodeck" = ["web/*.js", "workflows/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["audioqi/integrations/comfyui/sonic_holodeck"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
