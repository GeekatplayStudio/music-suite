allowBuilds:
  es5-ext: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - lucide-react@1.52.0
onlyBuiltDependencies:
  - es5-ext
  - sharp
  - unrs-resolver
overrides:
  postcss: "^8.5.28"
  sharp: "^0.35.0"
  # react-plotly.js only needs plotly.js as a peer; the factory binds it to the
  # dist-min bundle, so the full package and its map dependencies stay out.
  plotly.js: "npm:plotly.js-dist-min@^4.1.1"
