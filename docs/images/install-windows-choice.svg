<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#e8edf5"/>
  <rect x="55" y="35" width="1090" height="690" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#314158" flood-opacity=".2"/></filter></defs>
  <text x="95" y="82" font-family="Segoe UI, Arial" font-size="14" font-weight="700" letter-spacing="2" fill="#087a8c">WINDOWS INSTALLATION · STEP 3</text>
  <text x="95" y="122" font-family="Segoe UI, Arial" font-size="30" font-weight="700" fill="#172033">Choose standard or complete</text>
  <text x="95" y="154" font-family="Segoe UI, Arial" font-size="17" fill="#526077">Type y for every offline AI feature, or press Enter for the standard app.</text>
  <rect x="95" y="182" width="1010" height="466" rx="10" fill="#0c0c0c" stroke="#9aa6b7"/>
  <path d="M105 182h990a10 10 0 0 1 10 10v32H95v-32a10 10 0 0 1 10-10z" fill="#f4f4f4"/>
  <rect x="112" y="193" width="16" height="16" rx="3" fill="#148ca4"/>
  <text x="138" y="207" font-family="Segoe UI, Arial" font-size="14" fill="#202020">Geekatplay Studio Music Suite Installer</text>
  <text x="1030" y="207" font-family="Segoe UI Symbol, Arial" font-size="15" fill="#697386">—  □  ×</text>
  <g font-family="Consolas, Courier New, monospace" font-size="16">
    <text x="125" y="260" fill="#54d8ee">============================================================</text>
    <text x="125" y="284" fill="#54d8ee">  Geekatplay Studio Music Suite - Windows Installer</text>
    <text x="125" y="308" fill="#54d8ee">============================================================</text>
    <text x="125" y="342" fill="#f2f2f2">The installer checks every required library and installs</text>
    <text x="125" y="368" fill="#f2f2f2">anything missing:</text>
    <text x="125" y="394" fill="#f2f2f2">  - Python 3.12+, FFmpeg, Node.js and pnpm/npm</text>
    <text x="125" y="420" fill="#f2f2f2">  - Music Suite Python libraries and the web app</text>
    <text x="125" y="458" fill="#ffd866">OPTIONAL COMPLETE INSTALL</text>
    <text x="125" y="486" fill="#f2f2f2">Download every local AI model and optional instrument too?</text>
    <text x="125" y="512" fill="#f2f2f2">This enables AI songs, AI editing, XL quality, lyrics,</text>
    <text x="125" y="538" fill="#f2f2f2">all stem models, and Surge XT.</text>
    <text x="125" y="564" fill="#f2f2f2">Allow about 30 GB of downloads and at least 45 GB free.</text>
    <text x="125" y="610" fill="#ffffff">Complete install? [y/N] <tspan fill="#eeeeee">█</tspan></text>
  </g>
  <rect x="95" y="668" width="1010" height="38" rx="9" fill="#edf9fb" stroke="#b7e5eb"/>
  <text x="114" y="693" font-family="Segoe UI, Arial" font-size="14" fill="#24515a"><tspan font-weight="700">Tip:</tspan> Pressing Enter chooses the smaller standard installation. You can add models later.</text>
</svg>
